const emptyForm = {

const STORAGE_PREFIX = "schedario-entries-";
const GITHUB_CONFIG_KEY = "schedario-github-config";

function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

/* ---------- localStorage helpers ---------- */
function loadCategory(key) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}
function saveCategory(key, list) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(list));
  } catch (e) {
    console.error("Errore di salvataggio locale:", e);
  }
}
function loadGithubConfig() {
  try {
    const raw = localStorage.getItem(GITHUB_CONFIG_KEY);
    return raw ? JSON.parse(raw) : { token: "", repo: "", path: "schedario-backup.json", branch: "main", autoBackup: false, lastBackupAt: null };
  } catch (e) {
    return { token: "", repo: "", path: "schedario-backup.json", branch: "main", autoBackup: false, lastBackupAt: null };
  }
}
function saveGithubConfig(cfg) {
  try {
    localStorage.setItem(GITHUB_CONFIG_KEY, JSON.stringify(cfg));
  } catch (e) {}
}

/* ---------- Base64 (UTF-8 safe) ---------- */
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach((b) => (binary += String.fromCharCode(b)));
  return btoa(binary);
}
function base64ToUtf8(b64) {
  const binary = atob(b64.replace(/\n/g, ""));
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------- GitHub API ---------- */
function encodedPath(path) {
  return path.split("/").filter(Boolean).map(encodeURIComponent).join("/");
}
async function githubGetFile(cfg) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${encodedPath(cfg.path)}?ref=${encodeURIComponent(cfg.branch || "main")}`;
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" },
  });
  if (res.status === 404) return null;
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.message || `Errore GitHub (${res.status})`);
  }
  return res.json();
}
async function githubPushBackup(cfg, dataObj) {
  const existing = await githubGetFile(cfg);
  const body = {
    message: `Backup Schedario - ${new Date().toLocaleString("it-IT")}`,
    content: utf8ToBase64(JSON.stringify(dataObj, null, 2)),
    branch: cfg.branch || "main",
  };
  if (existing && existing.sha) body.sha = existing.sha;
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${encodedPath(cfg.path)}`;
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      Authorization: `Bearer ${cfg.token}`,
      Accept: "application/vnd.github+json",
      "Content-Type": "application/json",
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `Errore GitHub (${res.status})`);
  }
  return res.json();
}
async function githubRestoreBackup(cfg) {
  const file = await githubGetFile(cfg);
  if (!file) throw new Error("Nessun backup trovato su GitHub a questo percorso.");
  const decoded = base64ToUtf8(file.content);
  return JSON.parse(decoded);
}

/* ---------- Small pieces ---------- */
function Stamp({ text, color }) {
  return (
    <span
      className="inline-block"
      style={{
        padding: "2px 8px", fontSize: "10px", fontWeight: 700, textTransform: "uppercase",
        border: `2px solid ${color}`, borderRadius: "3px", color,
        transform: "rotate(-3deg)", letterSpacing: "0.12em",
        fontFamily: "'JetBrains Mono', monospace", background: "rgba(255,255,255,0.4)",
      }}
    >
      {text}
    </span>
  );
}
function Stars({ value, onChange, size = 16 }) {
  return (
    <div style={{ display: "flex", gap: "2px" }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button
          key={n} type="button"
          onClick={() => onChange && onChange(n === value ? 0 : n)}
          style={{ lineHeight: 0, cursor: onChange ? "pointer" : "default", background: "none", border: "none", padding: 0 }}
          aria-label={`${n} stelle`}
        >
          <IconStar size={size} filled={n <= value} color={n <= value ? C.gold : C.line} />
        </button>
      ))}
    </div>
  );
}
function Field({ label, children }) {
  return (
    <label style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
      <span style={{ fontSize: "11px", fontWeight: 700, textTransform: "uppercase", color: C.inkSoft, letterSpacing: "0.06em" }}>
        {label}
      </span>
      {children}
    </label>
  );
}
const inputStyle = { border: `1px solid ${C.line}`, background: C.paper, borderRadius: "6px", padding: "8px 12px", fontSize: "14px", width: "100%", fontFamily: "inherit" };

/* ---------- Entry form sheet ---------- */
function EntryFormSheet({ cat, initial, isEditing, onCancel, onSubmit }) {
  const [form, setForm] = useState(initial);
  const [titleError, setTitleError] = useState(false);
  const [imgError, setImgError] = useState(false);
  const effectiveStatus = form.status || cat.statuses[0];
  const isInProgress = effectiveStatus === cat.statuses[1];

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.title.trim()) { setTitleError(true); return; }
    setTitleError(false);
    onSubmit(form);
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", justifyContent: "center", background: "rgba(38,34,27,0.5)" }}>
      <form onSubmit={handleSubmit} style={{
        background: C.card, borderLeft: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}`,
        height: "94vh", marginTop: "6vh", borderTopLeftRadius: "12px", borderTopRightRadius: "12px",
        width: "100%", maxWidth: "560px", overflowY: "auto",
      }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: "8px", flexWrap: "wrap",
          padding: "12px 20px", borderBottom: `1px solid ${C.line}`, background: C.card, position: "sticky", top: 0, zIndex: 1,
        }}>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: "1.15rem", marginRight: "auto", margin: 0 }}>
            {isEditing ? "Modifica scheda" : "Nuova scheda"} · {cat.label}
          </h2>
          <button type="button" onClick={onCancel} className="focus-ring" style={{ padding: "8px 12px", borderRadius: "6px", fontSize: "14px", fontWeight: 500, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
            Annulla
          </button>
          <button type="button" onClick={handleSubmit} className="focus-ring" style={{ padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: "#fff", background: cat.accent, border: "none", cursor: "pointer" }}>
            {isEditing ? "Salva" : "Aggiungi"}
          </button>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: "12px", padding: "16px 24px" }}>
          <Field label="Titolo *">
            <input autoFocus value={form.title}
              onChange={(e) => { setForm((f) => ({ ...f, title: e.target.value })); if (titleError) setTitleError(false); }}
              className="focus-ring" style={{ ...inputStyle, border: `1px solid ${titleError ? C.rust : C.line}` }} />
            {titleError && <span style={{ fontSize: "12px", color: C.rust }}>Serve almeno un titolo per salvare la scheda.</span>}
          </Field>

          <Field label="Immagine (link raw GitHub o altro link diretto)">
            <input type="url" value={form.image}
              onChange={(e) => { setForm((f) => ({ ...f, image: e.target.value })); setImgError(false); }}
              placeholder="https://raw.githubusercontent.com/…"
              className="focus-ring" style={inputStyle} />
            {form.image && !imgError && (
              <img src={form.image} alt="Anteprima copertina" onError={() => setImgError(true)}
                style={{ width: "88px", height: "88px", objectFit: "cover", borderRadius: "6px", border: `1px solid ${C.line}`, marginTop: "6px" }} />
            )}
            {form.image && imgError && (
              <span style={{ fontSize: "12px", color: C.inkSoft, marginTop: "4px" }}>
                Non riesco a caricare l'anteprima — controlla che sia il link "raw" e non la pagina normale.
              </span>
            )}
          </Field>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <Field label={cat.creatorLabel}>
              <input value={form.creator} onChange={(e) => setForm((f) => ({ ...f, creator: e.target.value }))} className="focus-ring" style={inputStyle} />
            </Field>
            <Field label="Anno">
              <input value={form.year} onChange={(e) => setForm((f) => ({ ...f, year: e.target.value }))} className="focus-ring" style={inputStyle} />
            </Field>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <Field label={cat.subtypeLabel}>
              <select value={form.subtype} onChange={(e) => setForm((f) => ({ ...f, subtype: e.target.value }))} className="focus-ring" style={inputStyle}>
                <option value="">—</option>
                {cat.subtypeOptions.map((o) => <option key={o}>{o}</option>)}
              </select>
            </Field>
            <Field label="Stato">
              <select value={form.status} onChange={(e) => setForm((f) => ({ ...f, status: e.target.value }))} className="focus-ring" style={inputStyle}>
                <option value="">{cat.statuses[0]}</option>
                {cat.statuses.map((o) => <option key={o}>{o}</option>)}
              </select>
            </Field>
          </div>

          <Field label="Genere">
            <input value={form.genre} onChange={(e) => setForm((f) => ({ ...f, genre: e.target.value }))}
              list={`genres-${cat.key}`} placeholder="Scrivi o scegli dai suggerimenti…" className="focus-ring" style={inputStyle} />
            <datalist id={`genres-${cat.key}`}>
              {cat.genreOptions.map((g) => <option key={g} value={g} />)}
            </datalist>
          </Field>

          <div style={{ display: "grid", gridTemplateColumns: isInProgress ? "1fr 1fr" : "1fr", gap: "12px", alignItems: "end" }}>
            {isInProgress && (
              <Field label={cat.progressLabel}>
                <input value={form.progress} onChange={(e) => setForm((f) => ({ ...f, progress: e.target.value }))} className="focus-ring" style={inputStyle} />
              </Field>
            )}
            <Field label="Data">
              <input type="date" value={form.date} onChange={(e) => setForm((f) => ({ ...f, date: e.target.value }))} className="focus-ring" style={inputStyle} />
            </Field>
          </div>

          <Field label="Voto">
            <Stars value={form.rating} onChange={(v) => setForm((f) => ({ ...f, rating: v }))} size={20} />
          </Field>

          <Field label="Note">
            <textarea value={form.notes} onChange={(e) => setForm((f) => ({ ...f, notes: e.target.value }))} rows={3}
              className="focus-ring" style={{ ...inputStyle, resize: "vertical" }} />
          </Field>

          <div style={{ display: "flex", justifyContent: "flex-end", gap: "8px", paddingTop: "12px", paddingBottom: "24px" }}>
            <button type="button" onClick={onCancel} className="focus-ring" style={{ padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 500, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
              Annulla
            </button>
            <button type="button" onClick={handleSubmit} className="focus-ring" style={{ padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: "#fff", background: cat.accent, border: "none", cursor: "pointer" }}>
              {isEditing ? "Salva modifiche" : "Aggiungi alla scheda"}
            </button>
          </div>
        </div>
      </form>
    </div>
  );
}

  const [showToken, setShowToken] = useState(false);

  const save = () => onSave(local);
  const doBackup = () => { onSave(local); onBackup(local); };
  const doRestore = () => { onSave(local); onRestore(local); };

  const statusColor = backupStatus.state === "error" ? C.rust : backupStatus.state === "success" ? C.green : C.inkSoft;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", justifyContent: "center", background: "rgba(38,34,27,0.5)" }}>
      <div style={{
        background: C.card, borderLeft: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}`,
        height: "94vh", marginTop: "6vh", borderTopLeftRadius: "12px", borderTopRightRadius: "12px",
        width: "100%", maxWidth: "560px", overflowY: "auto",
      }}>
        <div style={{
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: "8px",
          padding: "12px 20px", borderBottom: `1px solid ${C.line}`, background: C.card, position: "sticky", top: 0, zIndex: 1,
        }}>
          <h2 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: "1.15rem", margin: 0 }}>Backup su GitHub</h2>
          <button type="button" onClick={onCancel} className="focus-ring" style={{ background: "none", border: "none", cursor: "pointer", padding: "4px" }}>
            <IconX size={20} color={C.ink} />
          </button>
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: "14px", padding: "16px 24px" }}>
          <p style={{ fontSize: "13px", color: C.inkSoft, lineHeight: 1.5, margin: 0 }}>
            Collega un tuo repository GitHub per salvare una copia di sicurezza dei dati. Ti serve un
            <strong> Personal Access Token</strong> (impostazioni GitHub → Developer settings → Fine-grained tokens)
            con permesso di lettura/scrittura sui "Contents" del repository scelto. Il token resta salvato solo
            in questo browser: trattalo come una password e, se possibile, limitalo a un solo repository dedicato.
          </p>

                {showToken ? "Nascondi" : "Mostra"}

          </Field>

          <Field label="Repository (formato owner/repo)">
            <input value={local.repo} onChange={(e) => setLocal((c) => ({ ...c, repo: e.target.value }))}
              placeholder="kratosso24/schedario-backup" className="focus-ring" style={inputStyle} />
          </Field>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <Field label="Percorso file">
              <input value={local.path} onChange={(e) => setLocal((c) => ({ ...c, path: e.target.value }))}

            </Field>
            <Field label="Branch">
              <input value={local.branch} onChange={(e) => setLocal((c) => ({ ...c, branch: e.target.value }))}
                placeholder="main" className="focus-ring" style={inputStyle} />
            </Field>
          </div>

          <label style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", color: C.ink }}>
            <input type="checkbox" checked={local.autoBackup} onChange={(e) => setLocal((c) => ({ ...c, autoBackup: e.target.checked }))} />
            Backup automatico dopo ogni modifica (qualche secondo dopo l'ultima modifica)
          </label>

          <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
            <button type="button" onClick={save} className="focus-ring"
              style={{ padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: C.ink, background: C.paper, border: `1px solid ${C.line}`, cursor: "pointer" }}>
              Salva impostazioni
            </button>
            <button type="button" onClick={doBackup} className="focus-ring"
              style={{ display: "flex", alignItems: "center", gap: "6px", padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: "#fff", background: C.green, border: "none", cursor: "pointer" }}>
              <IconCloud size={15} color="#fff" /> Esegui backup ora
            </button>
            <button type="button" onClick={doRestore} className="focus-ring"
              style={{ display: "flex", alignItems: "center", gap: "6px", padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: "#fff", background: C.rust, border: "none", cursor: "pointer" }}>
              <IconDownload size={15} color="#fff" /> Ripristina da GitHub
            </button>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: "8px", fontSize: "13px", color: statusColor }}>
            {backupStatus.state === "working" && <IconLoader size={14} color={statusColor} className="spin" />}
            {backupStatus.state === "success" && <IconCheck size={14} color={statusColor} />}
            {backupStatus.state === "error" && <IconAlert size={14} color={statusColor} />}
            <span>
              {backupStatus.message || (local.lastBackupAt ? `Ultimo backup: ${new Date(local.lastBackupAt).toLocaleString("it-IT")}` : "Nessun backup ancora eseguito.")}
            </span>
          </div>

          <p style={{ fontSize: "12px", color: C.inkSoft, lineHeight: 1.5, marginTop: "8px" }}>
            "Ripristina da GitHub" sostituisce tutti i dati salvati in questo browser con quelli del file di backup.
            Usalo se cambi dispositivo o se devi recuperare i dati dopo aver svuotato la cache.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------- Main App ---------- */
function App() {
  const [entries, setEntries] = useState(() => {
    const res = {};
    CATEGORIES.forEach((c) => { res[c.key] = loadCategory(c.key); });
    return res;
  });
  const [activeTab, setActiveTab] = useState("musica");
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("Tutti");
  const [formOpen, setFormOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyForm);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [githubConfig, setGithubConfig] = useState(loadGithubConfig());
  const [backupStatus, setBackupStatus] = useState({ state: "idle", message: "" });
  const autoBackupTimer = useRef(null);

  const cat = CATEGORIES.find((c) => c.key === activeTab);
  const Icon = cat.icon;

  const runBackup = useCallback(async (cfg) => {
    if (!cfg.token || !cfg.repo) {
      setBackupStatus({ state: "error", message: "Configura token e repository prima di eseguire il backup." });
      return;
    }
    setBackupStatus({ state: "working", message: "Backup in corso…" });
    try {
      const dataObj = { exportedAt: new Date().toISOString(), entries };
      await githubPushBackup(cfg, dataObj);
      const now = new Date().toISOString();
      const newCfg = { ...cfg, lastBackupAt: now };
      setGithubConfig(newCfg);
      saveGithubConfig(newCfg);
      setBackupStatus({ state: "success", message: `Backup completato alle ${new Date(now).toLocaleTimeString("it-IT")}` });
    } catch (e) {
      setBackupStatus({ state: "error", message: e.message || "Errore durante il backup." });
    }
  }, [entries]);

  const runRestore = useCallback(async (cfg) => {
    if (!cfg.token || !cfg.repo) {
      setBackupStatus({ state: "error", message: "Configura token e repository prima di ripristinare." });
      return;
    }
    if (!window.confirm("Questo sostituirà tutti i dati salvati in questo browser con quelli del backup su GitHub. Continuare?")) return;
    setBackupStatus({ state: "working", message: "Ripristino in corso…" });
    try {
      const dataObj = await githubRestoreBackup(cfg);
      const restored = dataObj.entries || dataObj;
      const next = {};
      CATEGORIES.forEach((c) => {
        next[c.key] = restored[c.key] || [];
        saveCategory(c.key, next[c.key]);
      });
      setEntries(next);
      setBackupStatus({ state: "success", message: "Ripristino completato." });
    } catch (e) {
      setBackupStatus({ state: "error", message: e.message || "Errore durante il ripristino." });
    }
  }, []);

  const scheduleAutoBackup = useCallback((cfg) => {
    if (!cfg.autoBackup || !cfg.token || !cfg.repo) return;
    clearTimeout(autoBackupTimer.current);
    autoBackupTimer.current = setTimeout(() => runBackup(cfg), 4000);
  }, [runBackup]);

  const updateCategory = useCallback((categoryKey, updater) => {
    setEntries((prev) => {
      const next = { ...prev, [categoryKey]: updater(prev[categoryKey]) };
      saveCategory(categoryKey, next[categoryKey]);
      scheduleAutoBackup(githubConfig);
      return next;
    });
  }, [scheduleAutoBackup, githubConfig]);

  const openNew = () => { setForm(emptyForm); setEditingId(null); setFormOpen(true); };
  const openEdit = (entry) => { setForm(entry); setEditingId(entry.id); setFormOpen(true); };
  const closeForm = () => { setFormOpen(false); setEditingId(null); setForm(emptyForm); };

  const submitForm = (submittedData) => {
    if (!submittedData.title.trim()) return;
    const status = submittedData.status || cat.statuses[0];
    if (editingId) {
      updateCategory(activeTab, (list) => list.map((it) => (it.id === editingId ? { ...submittedData, status, id: editingId } : it)));
    } else {
      const newEntry = { ...submittedData, status, id: uid(), createdAt: Date.now() };
      updateCategory(activeTab, (list) => [newEntry, ...list]);
    }
    closeForm();
  };

  const removeEntry = (id) => updateCategory(activeTab, (list) => list.filter((it) => it.id !== id));

  const list = entries[activeTab] || [];
  const filtered = useMemo(() => {
    return list
      .filter((it) => (statusFilter === "Tutti" ? true : it.status === statusFilter))
      .filter((it) => {
        if (!search.trim()) return true;
        const q = search.toLowerCase();
        return it.title.toLowerCase().includes(q) || (it.creator || "").toLowerCase().includes(q) || (it.notes || "").toLowerCase().includes(q);
      });
  }, [list, statusFilter, search]);

  const totalAll = CATEGORIES.reduce((sum, c) => sum + (entries[c.key]?.length || 0), 0);

  return (
    <div style={{ minHeight: "100vh", width: "100%", background: C.paper, color: C.ink }}>
      <header style={{ padding: "40px 20px 24px", borderBottom: `1px solid ${C.line}` }}>
        <div style={{ maxWidth: "1000px", margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap", gap: "8px" }}>
            <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 700, fontSize: "clamp(2rem, 5vw, 2.75rem)", margin: 0 }}>Schedario</h1>
            <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
              <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "12px", color: C.inkSoft, textTransform: "uppercase", letterSpacing: "0.15em" }}>
                {totalAll} schede archiviate
              </span>
              <button onClick={() => setSettingsOpen(true)} className="focus-ring" aria-label="Impostazioni backup"
                style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: "6px", padding: "6px", cursor: "pointer", display: "flex" }}>
                <IconSettings size={16} color={C.inkSoft} />
              </button>
            </div>
          </div>
          <p style={{ marginTop: "4px", color: C.inkSoft, fontFamily: "'Fraunces', serif", fontStyle: "italic" }}>
            il tuo archivio personale di musica, film, serie, fumetti e libri
          </p>
        </div>
      </header>

      <nav style={{ padding: "24px 20px" }}>
        <div style={{ maxWidth: "1000px", margin: "0 auto", display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px" }}>
          {CATEGORIES.map((c) => {
            const CIcon = c.icon;
            const isActive = c.key === activeTab;
            return (
              <button key={c.key} onClick={() => { setActiveTab(c.key); setStatusFilter("Tutti"); setSearch(""); }}
                className="focus-ring"
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center", gap: "8px", padding: "10px 16px",
                  borderRadius: "6px", fontSize: "14px", fontWeight: 600, cursor: "pointer", width: "100%",
                  background: isActive ? C.card : "transparent", color: isActive ? c.accent : C.inkSoft,
                  border: `1px solid ${C.line}`,
                }}>
                <CIcon size={16} color={isActive ? c.accent : C.inkSoft} />
                {c.label}
                <span style={{
                  marginLeft: "4px", padding: "0 6px", borderRadius: "999px", fontSize: "11px",
                  background: isActive ? c.accent : C.line, color: isActive ? "#fff" : C.inkSoft,
                  fontFamily: "'JetBrains Mono', monospace",
                }}>
                  {entries[c.key]?.length || 0}
                </span>
              </button>
            );
          })}
        </div>
      </nav>

      <div style={{ padding: "16px 20px", borderTop: `1px solid ${C.line}`, borderBottom: `1px solid ${C.line}`, background: C.card }}>
        <div style={{ maxWidth: "1000px", margin: "0 auto", display: "flex", flexDirection: "column", gap: "12px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "8px", padding: "8px 12px", borderRadius: "6px", background: C.paper, border: `1px solid ${C.line}`, width: "100%" }}>
            <IconSearch size={16} color={C.inkSoft} />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder={`Cerca in ${cat.label.toLowerCase()}…`}
              className="focus-ring" style={{ background: "transparent", outline: "none", flex: 1, fontSize: "14px", border: "none", color: C.ink }} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px" }}>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="focus-ring"
              style={{ width: "100%", padding: "8px 12px", borderRadius: "6px", fontSize: "14px", background: C.paper, border: `1px solid ${C.line}`, color: C.ink }}>
              <option>Tutti</option>
              {cat.statuses.map((s) => <option key={s}>{s}</option>)}
            </select>
            <button onClick={openNew} className="focus-ring"
              style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: "6px", width: "100%", padding: "8px 16px", borderRadius: "6px", fontSize: "14px", fontWeight: 600, color: "#fff", background: cat.accent, border: "none", cursor: "pointer" }}>
              <IconPlus size={16} color="#fff" /> Nuova scheda
            </button>
          </div>
        </div>
      </div>

      <main style={{ padding: "32px 20px" }}>
        <div style={{ maxWidth: "1000px", margin: "0 auto" }}>
          {filtered.length === 0 ? (
            <div style={{ textAlign: "center", padding: "64px 0", borderRadius: "8px", border: `2px dashed ${C.line}`, color: C.inkSoft }}>
              <Icon size={28} color={C.line} />
              <p style={{ fontFamily: "'Fraunces', serif", fontSize: "1.1rem", marginTop: "12px" }}>
                {list.length === 0 ? `Nessuna scheda in ${cat.label.toLowerCase()} ancora.` : "Nessuna scheda corrisponde alla ricerca."}
              </p>
              <p style={{ fontSize: "14px" }}>{list.length === 0 ? 'Aggiungi la prima con "Nuova scheda".' : "Prova a cambiare filtro o ricerca."}</p>
            </div>
          ) : (
            <div style={{ display: "grid", gap: "16px", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))" }}>
              {filtered.map((it) => (
                <article key={it.id} style={{ position: "relative", borderRadius: "6px", padding: "16px", display: "flex", flexDirection: "column", gap: "8px", background: C.card, border: `1px solid ${C.line}`, boxShadow: "0 1px 0 rgba(0,0,0,0.03)" }}>
                  {it.image && (
                    <img src={it.image} alt={it.title} loading="lazy" onError={(e) => { e.currentTarget.style.display = "none"; }}
                      style={{ width: "100%", height: "140px", objectFit: "cover", borderRadius: "6px", border: `1px solid ${C.line}` }} />
                  )}
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: "8px" }}>
                    <span style={{ fontSize: "11px", fontFamily: "'JetBrains Mono', monospace", color: C.inkSoft }}>
                      {cat.prefix}-{String(list.length - list.findIndex((x) => x.id === it.id)).padStart(3, "0")}
                    </span>
                    <div style={{ display: "flex", gap: "4px" }}>
                      <button onClick={() => openEdit(it)} className="focus-ring" aria-label="Modifica scheda" style={{ background: "none", border: "none", cursor: "pointer", padding: "4px" }}>
                        <IconPencil size={14} color={C.inkSoft} />
                      </button>
                      <button onClick={() => removeEntry(it.id)} className="focus-ring" aria-label="Elimina scheda" style={{ background: "none", border: "none", cursor: "pointer", padding: "4px" }}>
                        <IconTrash size={14} color={C.rust} />
                      </button>
                    </div>
                  </div>

                  <h3 style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: "1.15rem", lineHeight: 1.25, margin: 0 }}>
                    {it.title}
                    {it.year ? <span style={{ color: C.inkSoft, fontWeight: 400 }}> ({it.year})</span> : null}
                  </h3>

                  {it.creator && <p style={{ fontSize: "14px", color: C.inkSoft, margin: 0 }}>{cat.creatorLabel}: {it.creator}</p>}
                  {(it.subtype || it.genre) && (
                    <p style={{ fontSize: "12px", textTransform: "uppercase", color: C.inkSoft, letterSpacing: "0.08em", margin: 0 }}>
                      {[it.subtype, it.genre].filter(Boolean).join(" · ")}
                    </p>
                  )}

                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: "4px" }}>
                    <Stamp text={it.status} color={cat.accent} />
                    <Stars value={it.rating || 0} size={14} />
                  </div>

                  {it.progress && <p style={{ fontSize: "12px", color: C.inkSoft, margin: 0 }}>{cat.progressLabel}: {it.progress}</p>}
                  {it.date && <p style={{ fontSize: "12px", fontFamily: "'JetBrains Mono', monospace", color: C.inkSoft, margin: 0 }}>{it.date}</p>}
                  {it.notes && (
                    <p style={{ fontSize: "14px", marginTop: "4px", paddingTop: "8px", borderTop: `1px solid ${C.line}`, color: C.ink, whiteSpace: "pre-wrap" }}>
                      {it.notes}
                    </p>
                  )}
                </article>
              ))}
            </div>
          )}
        </div>
      </main>

      {formOpen && (
        <EntryFormSheet key={editingId || "new"} cat={cat} initial={form} isEditing={!!editingId} onCancel={closeForm} onSubmit={submitForm} />
      )}

      {settingsOpen && (
        <SettingsSheet
          config={githubConfig}
          backupStatus={backupStatus}
          onCancel={() => setSettingsOpen(false)}
          onSave={(cfg) => { setGithubConfig(cfg); saveGithubConfig(cfg); }}
          onBackup={runBackup}
          onRestore={runRestore}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
